# DX-1: informational only — do not fail PRs on coverage %.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
  ignore:
    - "apps/web/tests/**"
    - "**/*.test.ts"
    - "**/*_test.go"
    - "db/**"
    - "docs/**"
    - "scripts/**"

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: true
