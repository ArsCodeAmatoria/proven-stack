# Air config for Go worker hot reload (foundation).
# The WORKER path is substituted at image build time when needed.

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/notify-worker"
  cmd = "go build -o ./tmp/notify-worker ./cmd/notify-worker"
  delay = 500
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
